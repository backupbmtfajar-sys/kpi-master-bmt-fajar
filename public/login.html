<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | KPI Marketing BMT Fajar</title><link rel="stylesheet" href="/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b2241,#1e5ca5)}
.login-wrap{width:min(920px,94vw);display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.login-visual{padding:55px;background:linear-gradient(145deg,#0d294c,#1768bd);color:#fff;position:relative}.login-visual h1{font-size:34px;margin:80px 0 10px}.login-visual p{color:#d4e5f8;font-size:13px;line-height:1.7}.login-visual .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}.orb.a{width:230px;height:230px;right:-80px;top:-70px}.orb.b{width:180px;height:180px;left:-80px;bottom:-70px}
.login-box{padding:55px 45px}.login-box h2{margin:0 0 8px;color:#173a68}.login-box p{font-size:12px;color:#7b8ba0;margin-bottom:25px}.field{margin-bottom:15px}.field label{display:block;font-size:10px;font-weight:700;color:#536b88;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d7e2ef;border-radius:7px;outline:0}.field input:focus{border-color:#3188e9}.login-btn{width:100%;padding:12px;border:0;border-radius:7px;background:linear-gradient(90deg,#1670d5,#3a9af1);color:#fff;font-weight:700;cursor:pointer}.error{color:#d34b4b;font-size:10px;margin-top:10px;min-height:15px}@media(max-width:700px){.login-wrap{grid-template-columns:1fr}.login-visual{display:none}}
</style></head>
<body>
<div class="login-wrap"><div class="login-visual"><div class="brand"><div class="brand-mark">◢</div><div><strong>BMT FAJAR</strong><span>Sistem KPI Marketing</span></div></div><div class="orb a"></div><div class="orb b"></div><h1>KPI Marketing</h1><p>Dashboard kinerja Account Officer & Funding Officer yang terhubung langsung dengan database Google Spreadsheet.</p></div>
<div class="login-box"><h2>Selamat Datang</h2><p>Silakan masuk sebagai Administrator.</p><form id="loginForm"><div class="field"><label>USERNAME</label><input id="username" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="login-btn">Masuk ke Dashboard</button><div class="error" id="error"></div></form></div></div>
<script>
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
 e.preventDefault(); const error=document.getElementById('error'); error.textContent='Memproses...';
 try{const r=await fetch('/.netlify/functions/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Login gagal');location.href='/';}catch(err){error.textContent=err.message;}
});
</script></body></html>
